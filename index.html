<p class="lead">My vision is to help students identify their strengths, explore educational opportunities, and build a successful future with confidence.</p>

about:()=>`<section class="sec"><div class="wrap"><div class="eye">About</div><h1>Meet Your Career Guidance Partner</h1>
<p class="lead">I am a Senior Educational Counsellor dedicated to helping students and parents make informed decisions about education, competitive examinations, and future career opportunities. My mission is to understand every student's interests, abilities, ambitions, and academic background and guide them towards the right career path.</p>
<div class="quote">I believe every student has potential. The right guidance at the right time can transform their future.</div>
<div class="grid"><div class="card"><h3>Student-focused counselling</h3><p>Every plan starts with the student, not the trend.</p></div>
<div class="card"><h3>Parent engagement</h3><p>Families included in the conversation.</p></div>

let db=null;

function rule(f){const d=new FormData(f),e={};let ok=true;
const set=(n,m)=>{const el=f.elements[n],s=el.nextElementSibling;if(m){ok=false;if(s)s.textContent=m;el.setAttribute("aria-invalid","true")}else{if(s)s.textContent="";el.removeAttribute("aria-invalid")}};
const v=n=>(d.get(n)||"").trim();
set("student",v("student").length<2?"Please enter the student's name":"");
set("mobile",/^[+]?[0-9 ]{10,14}$/.test(v("mobile"))?"":"Enter a valid mobile number");
set("email",v("email")&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email"))?"Enter a valid email":"");
set("cls",v("cls")?"":"Select a class");
return ok}
function summary(f){const d=Object.fromEntries(new FormData(f));return`Career counselling enquiry\nStudent: ${d.student}\nParent: ${d.parent||"-"}\nMobile: ${d.mobile}\nEmail: ${d.email||"-"}\nClass: ${d.cls}\nSchool/College: ${d.school||"-"}\nField: ${d.field||"-"}\nPreferred date: ${d.date||"-"}\nMessage: ${d.msg||"-"}`}
function bindForm(id){const f=$("#"+id);if(!f)return;
f.querySelector("[data-wa]").addEventListener("click",e=>{e.currentTarget.href=wa(rule(f)?summary(f):"Hello Nitin, I would like to book a career counselling session.")});
f.addEventListener("submit",async e=>{e.preventDefault();if(!rule(f))return;const out=f.querySelector("[data-out]"),btn=f.querySelector("button[type=submit]");
const d=Object.fromEntries(new FormData(f));btn.disabled=true;let saved=false;
try{const r=CFG.formspree?await fetch(CFG.formspree,{method:"POST",headers:{Accept:"application/json"},body:new FormData(f)}):await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams([["form-name","enquiry"],...new FormData(f)])});saved=r.ok}catch(x){saved=false}
btn.disabled=false;const t=summary(f);
out.innerHTML=saved?`<div class="ok"><strong>Thank you, ${esc(d.student)}.</strong> Your enquiry has been sent. You will be contacted on ${esc(d.mobile)}. For a faster reply you can also <a href="${wa(t)}" target="_blank" rel="noopener">message on WhatsApp</a>.</div>`
:`<div class="ok"><strong>We could not send the form online.</strong> Please send your details using one of these: <a href="${wa(t)}" target="_blank" rel="noopener">WhatsApp</a> or <a href="mailto:${esc(CFG.email)}?subject=${encodeURIComponent("Counselling enquiry")}&body=${encodeURIComponent(t)}">Email</a>.</div>`;
if(saved)f.reset()})}
function bindPage(p){
if(p==="book")bindForm("f1");if(p==="contact")bindForm("f2");
if(p==="services"){const box=$("#svc");document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{const s=SERVICES[b.dataset.more];box.innerHTML=`<div class="det"><h3>${esc(s[0])}</h3><p>${esc(s[1])} Book a session to discuss how this applies to your situation.</p><a class="btn b3" href="#book">Book Free Counselling</a></div>`;box.scrollIntoView({behavior:"smooth",block:"center"})});
document.querySelectorAll("[data-enq]").forEach(b=>b.onclick=()=>{const s=SERVICES[b.dataset.enq];box.innerHTML=`<div class="det"><h3>Enquire: ${esc(s[0])}</h3>${enq("f3")}</div>`;const f=$("#f3");f.elements.field.value=s[0];bindForm("f3");box.scrollIntoView({behavior:"smooth",block:"center"})})}
if(p==="explorer"){let cur=Object.keys(EXPLORER)[0],sub=0;const draw=()=>{$("#subs").innerHTML=EXPLORER[cur].map((x,i)=>`<button class="tab ${i===sub?"on":""}" data-s="${i}">${esc(x[0])}</button>`).join("");const x=EXPLORER[cur][sub];$("#det").innerHTML=`<h3>${esc(x[0])}</h3><p class="lead" style="margin:0">${esc(x[1])}</p>`;
$("#subs").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=+b.dataset.s;draw()})};
$("#tabs").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{cur=b.dataset.t;sub=0;$("#tabs").querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===b));draw()});draw()}}
function route(){let p=(location.hash||"#home").slice(1);if(!PAGES[p])p="home";
